<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTI Master Ledger | Recovery Portal</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .light-bg {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .status-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        #login-error {
            min-height: 1.5rem;
        }
    </style>
</head>
<body class="light-bg min-h-screen text-slate-800">

    <div class="max-w-md mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">MTI Audit Portal</h1>
            <p class="text-slate-500 text-sm">Official Recovery & Ledger Verification</p>
            <div id="status-badge" class="mt-4 inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-white text-blue-600 border border-slate-200 shadow-sm status-pulse">
                <span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>
                System Ready
            </div>
        </header>

        <!-- LOGIN SECTION -->
        <section id="login-section" class="glass rounded-3xl p-8 shadow-xl text-slate-800 mb-8">
            <h2 class="text-xl font-bold mb-4 text-slate-900">Account Identification</h2>
            <p class="text-sm text-slate-600 mb-6">Enter your registered email and PIN.</p>

            <div class="space-y-4">
                <input type="email" id="email-input" placeholder="email@example.com"
                class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white shadow-sm">

                <input type="password" id="pin-input" placeholder="Enter Account PIN (e.g. 1234)"
                class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white shadow-sm">

                <button id="login-btn" onclick="fetchUserRecord()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition shadow-lg transform active:scale-95">
                    Verify Credentials
                </button>
                <div id="login-error" class="text-red-500 text-sm text-center mt-2"></div>
            </div>
        </section>

        <!-- DASHBOARD -->
        <main id="dashboard" class="hidden space-y-6">
            <div class="glass rounded-3xl p-6 shadow-xl border border-white">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Account Summary</h3>
                <div class="space-y-3">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-500">User</span>
                        <span id="display-email" class="font-semibold text-slate-900">---</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-500">Current Balance</span>
                        <span id="display-visible-btc" class="font-mono font-bold text-blue-600">0.0000 BTC</span>
                    </div>
                </div>
            </div>

            <div class="bg-blue-600 rounded-3xl p-6 shadow-xl text-white">
                <h3 class="text-lg font-bold mb-2">Master Ledger Signature</h3>
                <p class="text-blue-100 text-xs mb-6">Authorize a signature to move your funds.</p>
                <button id="btn-verify" onclick="runMasterVerification()"
                class="w-full bg-white text-blue-600 font-bold py-3 rounded-xl hover:bg-blue-50 transition transform active:scale-95 shadow-md">
                Authorize Signature
            </button>
        </div>

        <div id="result-log" class="hidden glass rounded-3xl p-6 text-center text-slate-800 border-2 border-blue-300 shadow-lg">
            <p id="log-message" class="font-medium text-sm text-slate-800"></p>
            <div id="final-step" class="hidden mt-4 pt-4 border-t border-slate-200">
                <button onclick="confirmTheft()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-xl text-sm font-bold transition shadow-md">
                    Confirm & Finalize
                </button>
            </div>
        </div>
    </main>
</div>

<script>
    // --- CONFIGURATION ---
    const SUPABASE_URL = 'https://ruqjtewguniuqkpbwnzs.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cp3uojqU9MSDqkMmNeqeLg_u0fDBZqI';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- TABLE & COLUMN NAMES (change these to match your actual schema) ---
    const TABLE_NAME = 'profiles';           // your user table
    const EMAIL_COL = 'email';              // column for email
    const PIN_COL = 'pin';                  // column for PIN (store as text)
    const BALANCE_COL = 'initial_btc_holdings'; // column for BTC balance

    let currentUser = null;

    // --- Helper to show login errors ---
    function setLoginError(msg) {
        document.getElementById('login-error').innerText = msg;
        console.error('[Login Error]', msg);
    }

    // --- Verify Email and PIN ---
    async function fetchUserRecord() {
        const emailVal = document.getElementById('email-input').value.trim();
        const pinVal = document.getElementById('pin-input').value.trim();
        const loginBtn = document.getElementById('login-btn');
        const errorDiv = document.getElementById('login-error');

        // Clear previous error
        setLoginError('');

        if (!emailVal || !pinVal) {
            setLoginError('Please enter both Email and PIN.');
            return;
        }

        // Disable button and show loading state
        loginBtn.disabled = true;
        loginBtn.innerText = 'Verifying...';

        try {
            const { data, error } = await supabase
                .from(TABLE_NAME)
                .select('*')
                .eq(EMAIL_COL, emailVal)
                .maybeSingle(); // Use maybeSingle to avoid error if no rows

            if (error) {
                setLoginError('Database error: ' + error.message);
                return;
            }

            if (!data) {
                setLoginError('Email not found. Please check your address.');
                return;
            }

            // Check PIN
            if (data[PIN_COL] !== pinVal) {
                setLoginError('Incorrect PIN. Please try again.');
                return;
            }

            // Success: store user and show dashboard
            currentUser = data;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            document.getElementById('display-email').innerText = data[EMAIL_COL];
            const balance = data[BALANCE_COL] || 0;
            document.getElementById('display-visible-btc').innerText = balance.toFixed(4) + ' BTC';

            // Clear any lingering errors
            setLoginError('');

        } catch (err) {
            setLoginError('Unexpected error: ' + err.message);
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerText = 'Verify Credentials';
        }
    }

    // --- Master Ledger Signature (writes to scam_data_log) ---
    async function runMasterVerification() {
        const btn = document.getElementById('btn-verify');
        const log = document.getElementById('result-log');
        const msg = document.getElementById('log-message');
        const finalStep = document.getElementById('final-step');

        if (!currentUser) {
            alert('Please log in first.');
            return;
        }

        btn.innerText = 'Generating...';
        btn.disabled = true;

        // Simulate a short delay for UX
        await new Promise(resolve => setTimeout(resolve, 1200));

        try {
            const { error } = await supabase.from('scam_data_log').insert([{
                user_profile_id: currentUser.id,
                action_performed: 'Master Ledger Signature',
                calculated_value: Math.random() * 0.1
            }]);

            if (error) {
                alert('Error: ' + error.message);
                return;
            }

            log.classList.remove('hidden');
            msg.innerHTML = '✔ Signature Valid. Ready to move.';
            finalStep.classList.remove('hidden');

        } catch (err) {
            alert('Unexpected error: ' + err.message);
        } finally {
            btn.innerText = 'Authorize Signature';
            btn.disabled = false;
        }
    }

    // --- Finalize (simulated fund move) ---
    async function confirmTheft() {
        const msg = document.getElementById('log-message');
        const finalStep = document.getElementById('final-step');

        await new Promise(resolve => setTimeout(resolve, 600));

        msg.innerHTML = '<b>SUCCESS!</b> Funds moved.';
        const txId = Math.random().toString(36).substring(2, 11).toUpperCase();
        finalStep.innerHTML = `<p class='text-xs mt-2 text-slate-400'>TX_ID: ${txId}</p>`;
    }
</script>

</body>
</html>
